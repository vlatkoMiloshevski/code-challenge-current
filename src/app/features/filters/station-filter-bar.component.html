<div class="favorites-row">
  <span class="favorites-label" id="favorites-label">{{ favoritesLabel() }}</span>
  <ion-toggle
    size="small"
    aria-labelledby="favorites-label"
    [checked]="favoritesView()"
    (ionChange)="onFavoritesSwitch($event.detail.checked)"
  ></ion-toggle>
</div>

<div class="filters-header">
  <button
    type="button"
    class="section-toggle"
    [attr.aria-expanded]="expanded()"
    aria-controls="station-filter-groups"
    (click)="toggleExpanded()"
  >
    <span>Filters</span>
    @if (activeCount() > 0) {
      <span class="active-count" aria-label="active filters">{{ activeCount() }}</span>
    }
    <ion-icon [src]="chevronIcon()" aria-hidden="true"></ion-icon>
  </button>
</div>

@if (expanded()) {
  <div id="station-filter-groups" class="filter-groups">
    <div class="filter-group" role="group" aria-label="Status">
      <p class="group-caption">By status</p>
      @for (status of statusOptions; track status) {
        <ion-checkbox
          labelPlacement="end"
          [checked]="isStatusSelected(status)"
          (ionChange)="setStatus(status, $event.detail.checked)"
        >
          {{ statusLabels[status] }}
        </ion-checkbox>
      }
    </div>

    <div class="filter-group" role="group" aria-label="Connector types">
      <p class="group-caption">By connector</p>
      @for (type of connectorTypes(); track type) {
        <ion-checkbox
          labelPlacement="end"
          [checked]="isConnectorSelected(type)"
          (ionChange)="setConnector(type, $event.detail.checked)"
        >
          {{ type }}
        </ion-checkbox>
      }
    </div>

    @if (anyActive()) {
      <div>
        <ion-button fill="clear" size="small" (click)="clear()">Clear filters</ion-button>
      </div>
    }
  </div>
}
